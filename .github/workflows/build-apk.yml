name: Build APK

on:
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Decode keystore (opcional)
        id: keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "path=$RUNNER_TEMP/release.jks" >> "$GITHUB_OUTPUT"
          else
            echo "No hay keystore propio: se firmará con la clave de depuración."
            echo "path=" >> "$GITHUB_OUTPUT"
          fi

      - name: Build debug and release APKs
        env:
          MOTO_KEYSTORE_FILE: ${{ steps.keystore.outputs.path }}
          MOTO_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          MOTO_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          MOTO_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew --no-daemon assembleDebug assembleRelease

      - name: Rename APKs
        run: |
          mkdir -p artifacts
          cp app/build/outputs/apk/debug/app-debug.apk artifacts/galeria-debug.apk
          cp app/build/outputs/apk/release/app-release.apk artifacts/galeria.apk
          ls -lh artifacts

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: galeria-apk
          path: artifacts/*.apk
          if-no-files-found: error
          retention-days: 90
